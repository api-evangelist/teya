    RefundRequest:
      type: object
      description: A request to refund a transaction
      example:
        transaction_id: tr_87de9bea-b32d-4ef5-a481-b8ba48764325
        amount: 100
      properties:
        transaction_id:
          type: string
          description: The id of the original transaction that needs to be refunded
          minLength: 1
        merchant_reference:
          type: string
          description: An ID referencing the transaction on the client's side
          maxLength: 30
          minLength: 1
        amount:
          type: integer
          format: int64
          description: A positive integer representing the total amount to refund in the smallest currency unit (e.g., 100 cents to charge $1). The currency is the same as the original transaction.
      required:
      - amount
      - transaction_id
      title: RefundRequest
    Teya_Digital_Receipts_Service_CreateReceiptRequest:
      type: object
      description: Request to initiate creation of digital receipts
      example:
        country_code: GB
        language: en-GB
        recipient_phone_numbers:
        - '+123456789'
        - '+987654321'
        recipient_emails:
        - johndoe@mail.com
        - examplemail@email.com
      properties:
        country_code:
          type: string
          description: Country code (ISO 3166 format)
          example: HU
        language:
          type: string
          description: 'The language to be used to generate the receipt.

            It should follow BCP-47 https://www.rfc-editor.org/info/bcp47 format.

            If provided using the wrong format, the request will be rejected. If not provided, the receipt will be generated using the default language of the merchant.

            '
          example: en-GB
        recipient_phone_numbers:
          type: array
          description: List of phone numbers to send the receipt link to
          items:
            type: string
            description: List of phone numbers to send the receipt link to
            example: '+123456789'
        recipient_emails:
          type: array
          description: List of emails to send the receipt link to
          items:
            type: string
            description: List of emails to send the receipt link to
            example: email@example.com
        receipt_email_type:
          type: string
          default: CUSTOMER
          description: Type that indicates which email template to use
      required:
      - country_code
      title: CreateReceiptRequest
    Payments_Refunds_Wrapper_API_RefundIssuerResult:
      type: object
      example:
        approval_code: '123456'
        response_code: '00'
      properties:
        approval_code:
          type: string
          description: Identifier of the authorisation returned by the issuer. When the transaction is not authorised, this field is empty
        response_code:
          type: string
          description: Response code returned by the issuer, indicating the result of the operation
      title: IssuerResult
    Ecommerce_Transaction_Payments_-_Public_RedirectTransactionResponse:
      description: 'The response for a transaction request where 3DS challenge is returned '
      example:
        authentication_id: 5f7b1a3a-3b7a-4b1a-9b1a-3a3b7a4b1a9b
        created_at: '2022-03-01T15:29:59Z'
        redirect_html: <html>...</html>
        status: PENDING
        transaction_id: 5f7b1a3a-3b7a-4b1a-9b1a-3a3b7a4b1a9b
        updated_at: '2022-03-01T15:35:00Z'
      properties:
        authentication_id:
          description: The unique identifier for the authentication
          example: 5f7b1a3a-3b7a-4b1a-9b1a-3a3b7a4b1a9b
          format: uuid
          type: string
        created_at:
          description: The datetime that the transaction was created (ISO 8601 format)
          example: '2022-03-01T15:29:59Z'
          format: date-time
          type: string
        redirect_html:
          description: 3DS html content to present to a client
          example: https://merchant.com/callback
          type: string
        status:
          description: The status of the transaction
          enum:
          - SUCCESS
          - FAILURE
          - PENDING
          example: PENDING
          type: string
        transaction_id:
          description: The unique identifier for the new transaction
          example: 5f7b1a3a-3b7a-4b1a-9b1a-3a3b7a4b1a9b
          format: uuid
          type: string
        updated_at:
          description: The datetime that the transaction was updated (ISO 8601 format)
          example: '2022-03-01T15:35:00Z'
          format: date-time
          type: string
      required:
      - authentication_id
      - created_at
      - redirect_html
      - status
      - transaction_id
      - updated_at
      title: RedirectTransactionResponse
      type: object
    Ecommerce_Transaction_Payments_-_Public_OnlineTransaction:
      description: The response for a transaction request
      example:
        authentication_id: 5f7b1a3a-3b7a-4b1a-9b1a-3a3b7a4b1a9b
        created_at: '2022-03-01T15:29:59Z'
        issuer_result:
          approval_code: '123456'
          response_code: '00'
        status: SUCCESS
        transaction_id: 5f7b1a3a-3b7a-4b1a-9b1a-3a3b7a4b1a9b
        updated_at: '2022-03-01T15:35:00Z'
      properties:
        authentication_id:
          description: The unique identifier for the authentication
          example: 5f7b1a3a-3b7a-4b1a-9b1a-3a3b7a4b1a9b
          format: uuid
          type: string
        created_at:
          description: The datetime that the transaction was created (ISO 8601 format)
          format: date-time
          type: string
        issuer_result:
          $ref: '#/components/schemas/Ecommerce_Transaction_Payments_-_Public_IssuerResult'
        status:
          description: The status of the transaction
          enum:
          - SUCCESS
          - FAILURE
          - PENDING
          example: SUCCESS
          type: string
        status_reason:
          description: Detailed reasons for the transaction failure status. This is provided when the transaction response status is FAILURE and is null when the payment succeeds or is pending.
          enum:
          - ACCOUNT_INVALID
          - BLOCKED_CARD
          - BLOCKED_CROSS_BORDER_TRANSACTION
          - AMOUNT_TOO_SMALL
          - CANNOT_VALIDATE_AUTHENTICATION
          - CARD_COUNT_EXCEEDED
          - CARD_DECLINED
          - CARD_EXPIRED
          - CARD_LIMIT_EXCEEDED
          - CARD_NOT_ACTIVE
          - DISABLED_ACCOUNT
          - DO_NOT_HONOR
          - ECOM_NEGATIVE_CARD_AUTHENTICATION_VERIFICATION
          - EXCEEDS_AMOUNT_LIMIT
          - FORMAT_ERROR
          - INCORRECT_CARD_AUTHENTICATION
          - INSUFFICIENT_FUNDS
          - INVALID_CARD_NUMBER
          - INVALID_TRANSACTION
          - ISSUER_DECLINED
          - LOST_OR_STOLEN
          - MERCHANT_CONFIGURATION
          - NEGATIVE_BALANCE
          - PIN_LIMIT_EXCEEDED
          - PROCESSOR_UNAVAILABLE
          - RESTRICTED_CARD
          - SCA_PIN_REQUIRED
          - SCA_REQUIRED
          - SUSPECTED_FRAUD
          - TEMPORARY_ISSUE_RETRY
          - TIMEOUT
          - TRANSACTION_NOT_ALLOWED
          - UNABLE_TO_ROUTE_TRANSACTION
          - UNSUPPORTED_ISSUER
          - OTHER
          format: enum
          type: string
        token_response:
          $ref: '#/components/schemas/Ecommerce_Transaction_Payments_-_Public_TokenCreationResponse'
          description: The details of the created token
        transaction_id:
          description: The unique identifier for the new transaction
          example: 5f7b1a3a-3b7a-4b1a-9b1a-3a3b7a4b1a9b
          format: uuid
          type: string
        updated_at:
          description: The datetime that the transaction was updated (ISO 8601 format)
          format: date-time
          type: string
      required:
      - authentication_id
      - created_at
      - status
      - transaction_id
      - updated_at
      title: OnlineTransaction
      type: object
    Ecommerce_Transaction_Payments_-_Public_Cardholder:
