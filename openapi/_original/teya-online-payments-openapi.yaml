    pbl_UpdatePaymentLinkRequest:
      properties:
        expires_at:
          description: |
            New expiration timestamp in ISO-8601 format.
            Expiration can be set up to 5 minutes in the past or any time in the future. Expiry in the past effectively cancels the link.
            These links can have their expiration changed if needed in the future again.
            Payment link must be in one of the following states to be updated: VALID, EXPIRED, or MANUALLY_EXPIRED.
            If not provided in the request, the expiration will not be updated.
            If provided as null, the expiration will be cleared.
          example: "2026-07-03T13:37:58.709Z"
          format: date-time
          type: string
      title: UpdatePaymentLinkRequest
      type: object
    Teya_Digital_Receipts_Service_CreateReceiptRequest:
      type: object
      description: Request to initiate creation of digital receipts
      example:
        country_code: GB
        language: en-GB
        recipient_phone_numbers:
          - "+123456789"
          - "+987654321"
        recipient_emails:
          - johndoe@mail.com
          - examplemail@email.com
      properties:
        country_code:
          type: string
          description: Country code (ISO 3166 format)
          example: HU
        language:
          type: string
          description: |
            The language to be used to generate the receipt.
            It should follow BCP-47 https://www.rfc-editor.org/info/bcp47 format.
            If provided using the wrong format, the request will be rejected. If not provided, the receipt will be generated using the default language of the merchant.
          example: en-GB
        recipient_phone_numbers:
          type: array
          description: List of phone numbers to send the receipt link to
          items:
            type: string
            description: List of phone numbers to send the receipt link to
            example: "+123456789"
        recipient_emails:
          type: array
          description: List of emails to send the receipt link to
          items:
            type: string
            description: List of emails to send the receipt link to
            example: email@example.com
        receipt_email_type:
          type: string
          default: CUSTOMER
          description: Type that indicates which email template to use
      required:
        - country_code
      title: CreateReceiptRequest
    Teya_Digital_Receipts_Service_CreateReceiptResponse:
      type: object
      description: Creates a url for customers to view their receipt.
      example:
        receipt_id: 01916f63-c6e0-75a9-9ef4-764ba287b2c6
        transaction_id: 60cca1c7-38c5-4218-ba71-fb4a96836619
        url: https://receipts.teya.com/01916f63-c6e0-75a9-9ef4-764ba287b2c6
      properties:
        receipt_id:
          type: string
          format: uuid
          description: Id of the created receipt
        transaction_id:
          type: string
          description: Transaction id, the same as in the request
        url:
          type: string
          description: Url for receipt or error page in case or receipt generation failure
      required:
        - receipt_id
        - transaction_id
        - url
      title: CreateReceiptResponse
    Teya_Digital_Receipts_Service_Error:
      type: object
      description: Error response
      example:
        code: BAD_REQUEST
        description: Invalid input
      properties:
        code:
          type: string
          format: enum
          description: The error code
          enum:
            - BAD_REQUEST
            - UNAUTHORISED
            - FORBIDDEN
            - INTERNAL_SERVER_ERROR
            - TOO_MANY_REQUESTS
            - NOT_FOUND
            - NOT_ACCEPTABLE
        description:
          type: string
          description: The description of the error
      required:
        - code
        - description
      title: Error
    Payments_Refunds_Wrapper_API_Amount:
      type: object
      example:
        amount: 100
        currency: GBP
      properties:
        amount:
          type: integer
          format: int64
          description: A positive integer representing the total amount in the smallest currency unit (e.g., 100 cents to charge $1)
        currency:
          type: string
          description: Currency code (e.g. `USD`, `GBP`, `EUR`) following ISO-4217 format.
      required:
        - amount
        - currency
      title: Amount
    Payments_Refunds_Wrapper_API_DccResponse:
      type: object
      example:
        cardholder_amount:
          amount: 100
          currency: CHF
        conversion_rate: "0.9517"
        markup: "0.03"
        ecb_markup: "0.01"
      properties:
        cardholder_amount:
          $ref: "#/components/schemas/Payments_Refunds_Wrapper_API_Amount"
          description: |
            The total amount refunded to the customer in the smallest currency unit (e.g., 100 cents to charge $1).
        conversion_rate:
          type: string
          description: Conversion rate used to calculate the cardholder amount
        markup:
          type: string
          description: Markup of the exchange rate
        ecb_markup:
          type: string
          description: Markup of the exchange rate over the ECB exchange rate. Only provided when both currencies are EEA currencies.
      required:
        - cardholder_amount
        - conversion_rate
        - markup
      title: DccResponse
    CaptureRequest:
      type: object
      description: A request to capture a pre-authorised transaction
      example:
        amount: 1000
      properties:
        amount:
          type: integer
          format: int64
          description: A positive integer representing the amount to capture in the smallest currency unit (e.g., 100 cents to charge $1). Must be less than or equal to the original authorisation amount.
      required:
        - amount
      title: CaptureRequest
    CaptureResponse:
      type: object
      description: A response to a capture request
      example:
        transaction_id: tr_5f7b1a3a-3b7a-4b1a-9b1a-3a3b7a4b1a9b
        card_acceptor_id: "50001325"
        status: SUCCESS
        issuer_result:
          approval_code: "123456"
          response_code: "00"
        processed_at: "2021-01-01T00:00:00.000Z"
      properties:
        transaction_id:
          type: string
          description: Unique identifier of the capture created
        card_acceptor_id:
          type: string
          description: |
            `mid` or `card_acceptor_id` (ISO 8583 field standard).
            Used to uniquely identify the merchant in the transaction.
        status:
          type: string
          description: The status of the capture
          enum:
            - SUCCESS
            - FAILURE
            - PENDING
        status_reason:
          type: string
          description: Reason for `FAILURE` status
          enum:
            - ACCOUNT_INVALID
            - CANNOT_VALIDATE_AUTHENTICATION
            - CARD_COUNT_EXCEEDED
            - CARD_DECLINED
            - CARD_EXPIRED
            - CARD_LIMIT_EXCEEDED
            - CARD_NOT_ACTIVE
            - DISABLED_ACCOUNT
            - DO_NOT_HONOR
            - ECOM_NEGATIVE_CARD_AUTHENTICATION_VERIFICATION
            - EXCEEDS_AMOUNT_LIMIT
            - FORMAT_ERROR
            - INCORRECT_CARD_AUTHENTICATION
            - INSUFFICIENT_FUNDS
            - INVALID_CARD_NUMBER
            - INVALID_TRANSACTION
            - ISSUER_DECLINED
            - LOST_OR_STOLEN
            - MERCHANT_CONFIGURATION
            - PIN_LIMIT_EXCEEDED
            - PROCESSOR_UNAVAILABLE
            - RESTRICTED_CARD
            - SCA_PIN_REQUIRED
            - SCA_REQUIRED
            - SUSPECTED_FRAUD
            - TEMPORARY_ISSUE_RETRY
            - TIMEOUT
            - TRANSACTION_NOT_ALLOWED
            - UNABLE_TO_ROUTE_TRANSACTION
            - UNSUPPORTED_ISSUER
            - NEGATIVE_BALANCE_LIMIT
            - OTHER
        issuer_result:
          $ref: "#/components/schemas/Payments_Gateway_Service_CaptureIssuerResult"
          description: Result data for the capture according to issuer's response
          title: IssuerResult
        processed_at:
          type: string
          format: date-time
          description: The date and time the capture was processed (in ISO 8601 with time-zone).
      required:
        - card_acceptor_id
        - status
        - transaction_id
      title: CaptureResponse
    Payments_Gateway_Service_CaptureIssuerResult:
      type: object
      example:
        approval_code: "123456"
        response_code: "00"
      properties:
        approval_code:
          type: string
          description: Identifier of the authorisation returned by the issuer. When the transaction is not authorised, this field is empty
        response_code:
          type: string
          description: Response code returned by the issuer, indicating the result of the operation
      title: CaptureIssuerResult
    Payments_Refunds_Wrapper_API_RefundIssuerResult:
      type: object
      example:
        approval_code: "123456"
        response_code: "00"
      properties:
        approval_code:
          type: string
          description: Identifier of the authorisation returned by the issuer. When the transaction is not authorised, this field is empty
        response_code:
          type: string
          description: Response code returned by the issuer, indicating the result of the operation
      title: IssuerResult
    RefundRequest:
      type: object
      description: A request to refund a transaction
      example:
        transaction_id: tr_87de9bea-b32d-4ef5-a481-b8ba48764325
        amount: 100
      properties:
        transaction_id:
          type: string
          description: The id of the original transaction that needs to be refunded
          minLength: 1
        merchant_reference:
          type: string
          description: An ID referencing the transaction on the client's side
          maxLength: 30
          minLength: 1
        amount:
          type: integer
          format: int64
          description: A positive integer representing the total amount to refund in the smallest currency unit (e.g., 100 cents to charge $1). The currency is the same as the original transaction.
      required:
        - amount
        - transaction_id
      title: RefundRequest
    RefundResponse:
      type: object
      description: A response to refund a transaction
      example:
        transaction_id: tr_87de9bea-b32d-4ef5-a481-b8ba48764325
        refund_amount:
          amount: 100
          currency: GBP
        card_acceptor_id: "5023045"
        status: SUCCESS
        issuer_result:
          approval_code: "123456"
          response_code: "00"
        created_at: "2021-01-01T00:00:00.000Z"
        dcc:
          cardholder_amount:
            amount: 100
            currency: CHF
          conversion_rate: "0.9517"
          markup: "0.03"
          ecb_markup: "0.01"
      properties:
        transaction_id:
          type: string
          description: Unique identifier of the refund created
        status:
          type: string
          description: The status of the transaction
          enum:
            - SUCCESS
            - FAILURE
            - PENDING
        status_reason:
          type: string
          description: Reason for `FAILURE` status
          enum:
            - ACCOUNT_INVALID
            - CANNOT_VALIDATE_AUTHENTICATION
            - CARD_COUNT_EXCEEDED
            - CARD_DECLINED
            - CARD_EXPIRED
            - CARD_LIMIT_EXCEEDED
            - CARD_NOT_ACTIVE
            - DISABLED_ACCOUNT
            - DO_NOT_HONOR
            - ECOM_NEGATIVE_CARD_AUTHENTICATION_VERIFICATION
            - EXCEEDS_AMOUNT_LIMIT
            - FORMAT_ERROR
            - INCORRECT_CARD_AUTHENTICATION
            - INSUFFICIENT_FUNDS
            - INVALID_CARD_NUMBER
            - INVALID_TRANSACTION
            - ISSUER_DECLINED
            - LOST_OR_STOLEN
            - MERCHANT_CONFIGURATION
            - PIN_LIMIT_EXCEEDED
            - PROCESSOR_UNAVAILABLE
            - RESTRICTED_CARD
            - SCA_PIN_REQUIRED
            - SCA_REQUIRED
            - SUSPECTED_FRAUD
            - TEMPORARY_ISSUE_RETRY
            - TIMEOUT
            - TRANSACTION_NOT_ALLOWED
            - UNABLE_TO_ROUTE_TRANSACTION
            - UNSUPPORTED_ISSUER
            - NEGATIVE_BALANCE_LIMIT
            - OTHER
        issuer_result:
          $ref: "#/components/schemas/Payments_Refunds_Wrapper_API_RefundIssuerResult"
          description: Result data for the refund according to issuer's response
          title: IssuerResult
        created_at:
          type: string
          format: date-time
          description: The date and time the refund was created (in ISO 8601 with time-zone).
        refund_amount:
          $ref: "#/components/schemas/Payments_Refunds_Wrapper_API_Amount"
          description: A positive integer representing the total amount refunded in the smallest currency unit (e.g., 100 cents to charge $1)
          title: Amount
        card_acceptor_id:
          type: string
          description: |
            `mid` or `card_acceptor_id` (ISO 8583 field standard).
            Used to unique identify the merchant in the transaction.
        dcc:
          $ref: "#/components/schemas/Payments_Refunds_Wrapper_API_DccResponse"
          description: DCC data used for the refund
          title: DCC
      required:
        - card_acceptor_id
        - issuer_result
        - refund_amount
        - status
        - transaction_id
      title: RefundResponse
