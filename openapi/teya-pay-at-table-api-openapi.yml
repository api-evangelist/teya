          type: string
          format: date-time
          description: ISO 8601 creation timestamp (in UTC)
          example: '2026-04-14T10:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 last update timestamp (in UTC)
          example: '2026-04-14T10:00:00Z'
