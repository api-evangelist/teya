    TabListResponse:
      type: object
      description: Paginated list of tabs
      properties:
        tabs:
          type: array
          description: Page of tab summaries
          items:
            $ref: '#/components/schemas/TabSummary'
        paging:
          $ref: '#/components/schemas/CursorPaging'
          description: Cursor pagination envelope
      title: TabListResponse
    PaymentRequestSummary:
      type: object
      description: Summary of a payment request on a tab
      properties:
        payment_request_id:
          type: string
          format: uuid
          description: Payment request identifier
          example: 9c1a7c2c-3e2a-4d5b-9f8a-6c2e5a8c9d01
        merchant_reference:
          type: string
          description: Merchant-assigned reference for this payment request.
          example: ORDER_123
          maxLength: 100
        status:
          type: string
          description: Payment status
          enum:
          - NEW
          - IN_PROGRESS
          - SUCCESSFUL
          - FAILED
          - CANCELLING
          - CANCELLED
          example: SUCCESSFUL
        requested_amount:
          $ref: '#/components/schemas/RequestedAmount'
          description: Requested amount including tip and currency.
        payment_method:
          type: string
          description: Payment method used for this request. Optional — may be unset if the ePOS did not specify one.
          enum:
          - CARD
          - CASH
          example: CARD
        payment_type:
          type: string
          description: Pay-at-Table payment type. Set whenever the payment request was created against a tab.
          enum:
          - FULL
          - SPLIT
          example: FULL
        created_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the payment was created (in UTC)
          example: '2026-04-14T10:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp of when the payment was last updated (in UTC)
          example: '2026-04-14T10:05:00Z'
        metadata:
          $ref: '#/components/schemas/TransactionMetadata'
          description: Transaction metadata; present only on SUCCESSFUL payments.
        transaction_timestamp:
          type: string
          format: date-time
          description: When the terminal completed the transaction (ISO 8601, UTC). Present only on SUCCESSFUL payments.
          example: '2026-04-14T10:04:30Z'
      required:
      - created_at
      - payment_request_id
      - requested_amount
      - status
      - updated_at
      title: PaymentRequestSummary
