    TabDetailResponse:
      type: object
      description: Detailed tab response including bill state and linked payment requests.
      properties:
        tab_id:
          type: string
          format: uuid
          description: Tab identifier
          example: 3f2b6a2e-9d3e-4a1f-8f1e-6b2e5a8c9d01
        store_id:
          type: string
          format: uuid
          description: Store identifier
          example: eac4d470-4731-45b2-af6b-c828f03c1f9d
        tab_name:
          type: string
          description: Tab display name
          example: Table 5
        status:
          type: string
          description: Current tab status
          enum:
          - OPEN
          - PAYING
          - PAUSED
          - COMPLETED
          - CLOSED
          example: OPEN
        total_amount:
          $ref: '#/components/schemas/TabAmountWithCurrency'
          description: Total amount with currency
        total_paid:
          type: integer
          format: int64
          description: Total amount paid so far, in the same currency as total_amount
          example: 1500
        remaining:
          type: integer
          format: int64
          description: Remaining amount to be paid, in the same currency as total_amount
          example: 3500
        merchant_reference:
          type: string
          description: Merchant-assigned unique reference for the tab.
          example: ORDER-2026-001
        epos_instance_id:
          type: string
          description: ePOS instance identifier
          example: epos-register-1
        showing_bill_terminal_id:
          type: string
          description: Terminal currently showing the bill. Present only while a bill is being displayed.
          example: term-001
        bill_file_id:
          type: string
          description: Bill file identifier. Present only after a bill has been generated.
          example: bill-file-001
        payment_requests:
          type: array
          description: List of payment requests on this tab. Empty array when none exist; never null.
          items:
            $ref: '#/components/schemas/PaymentRequestSummary'
        created_at:
          type: string
          format: date-time
          description: ISO 8601 creation timestamp (in UTC)
          example: '2026-04-14T10:00:00Z'
        updated_at:
          type: string
          format: date-time
          description: ISO 8601 last update timestamp (in UTC)
          example: '2026-04-14T10:05:00Z'
        last_error_code:
          type: string
          description: Last ePOS-reported rejection on this tab. Present only when the ePOS POSTed /errors and no subsequent teardown event has cleared it. Polling clients use this as the fallback path for missed TAB_ERROR Pushy notifications.
          example: BILL_ALREADY_SETTLED
        last_error_message:
          type: string
          description: Human-readable error message paired with last_error_code.
          example: Bill has already been paid in full
        last_error_at:
          type: string
          format: date-time
          description: ISO 8601 timestamp when the rejection was recorded (in UTC).
          example: '2026-04-14T10:07:00Z'
      required:
      - created_at
      - merchant_reference
      - payment_requests
      - remaining
      - status
      - store_id
      - tab_id
      - tab_name
      - total_amount
      - total_paid
      - updated_at
      title: TabDetailResponse
