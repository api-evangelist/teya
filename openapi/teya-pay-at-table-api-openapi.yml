components:
  schemas:
    TabAmountWithCurrency:
      type: object
      description: Amount with currency for tab operations
      properties:
        amount:
          type: integer
          format: int64
          description: Amount in smallest currency unit (e.g., cents)
          example: 1500
        currency:
          type: string
          description: ISO 4217 currency code
          example: EUR
      required:
      - amount
      - currency
      title: TabAmountWithCurrency
    ExceptionResponse:
      type: object
      example:
        code: BAD_REQUEST
        description: Bad Request
      properties:
        code:
          type: string
          format: enum
          description: Error code
          example: BAD_REQUEST
        description:
          type: string
          description: Error description
          example: Bad Request
        invalid_params:
          type: array
          description: List of invalid request parameters. Populated for validation failures (400 / 422); omitted otherwise.
          items:
            $ref: '#/components/schemas/InvalidParams'
      title: ExceptionResponse
    RequestedAmount:
      type: object
      example:
        currency: GBP
        amount: 50
        tip: 0
      properties:
        currency:
          type: string
          format: ISO 4217
          description: The currency used in this payment. Must be a valid ISO 4217 currency code
          example: USD
        amount:
          type: integer
          format: int64
          description: A positive integer representing the full amount to charge in the smallest currency unit (e.g., 100 cents to charge $1). Inclusive of the tip
          example: 1500
        tip:
          type: integer
          format: int64
