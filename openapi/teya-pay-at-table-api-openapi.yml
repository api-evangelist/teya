    DccData:
      type: object
      description: Dynamic Currency Conversion data. If present, all fields are required.
      example:
        transaction_amount: 8500
        transaction_currency: GBP
        exchange_rate: '0.8650'
        conversion_fee: 2.5%
        disclaimer: I have been offered a choice of currencies and have chosen to accept DCC and pay in EUR at the exchange rate offered by Teya
      properties:
        transaction_amount:
          type: integer
          format: int64
          description: Transaction amount in the smallest currency unit (8500 = £85.00)
          example: 8500
        transaction_currency:
          type: string
          description: Currency used by the cardholder in ISO 4217 format (e.g. GBP)
          example: GBP
          maxLength: 3
          minLength: 3
          pattern: ^[A-Z]{3}$
        exchange_rate:
          type: string
          description: Exchange rate applied for DCC conversion (e.g. '0.8650' means 1 EUR (merchant currency) = 0.8650 GBP (cardholder currency))
          minLength: 1
        conversion_fee:
          type: string
          description: Conversion fee applied for DCC service, represented as a percentage string (e.g. '2.5%')
          example: 2.5%
          minLength: 1
        disclaimer:
          type: string
          description: Text printed on the customer's receipt confirming DCC acceptance and exchange rate details
          example: I have been offered a choice of currencies and have chosen to accept DCC and pay in GBP at the exchange rate offered by Teya
          maxLength: 500
          minLength: 1
      required:
      - conversion_fee
      - disclaimer
      - exchange_rate
      - transaction_amount
      - transaction_currency
      title: DccData
