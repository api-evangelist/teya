          TAB_PAYMENT_COMPLETED: '#/components/schemas/TabPaymentCompletedEvent'
          TAB_PAUSED: '#/components/schemas/TabPausedEvent'
          TAB_RESUMED: '#/components/schemas/TabResumedEvent'
          TAB_COMPLETED: '#/components/schemas/TabCompletedEvent'
          TAB_BILL_HIDDEN: '#/components/schemas/TabBillHiddenEvent'
      example: event_type=SHOW_BILL_REQUEST; see oneOf variants for full payload shapes
      oneOf:
      - $ref: '#/components/schemas/ShowBillRequestEvent'
      - $ref: '#/components/schemas/PayRequestEvent'
      - $ref: '#/components/schemas/TabPaymentProgressEvent'
      - $ref: '#/components/schemas/TabPaymentCompletedEvent'
      - $ref: '#/components/schemas/TabPausedEvent'
      - $ref: '#/components/schemas/TabResumedEvent'
      - $ref: '#/components/schemas/TabCompletedEvent'
      - $ref: '#/components/schemas/TabBillHiddenEvent'
      properties:
        event_type:
          type: string
      required:
      - event_type
      title: TabEvent
    TabBillHiddenEvent:
