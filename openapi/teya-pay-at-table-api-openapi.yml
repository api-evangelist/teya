  /poslink/v1/tabs/events:
    get:
      tags:
      - Pay at Table
      summary: Stream tab events for a store
      description: "Streams real-time tab events for a store using Server-Sent Events (SSE).\n\nEvent types: SHOW_BILL_REQUEST, PAY_REQUEST, TAB_PAYMENT_STATUS_PROGRESS,\nTAB_PAYMENT_COMPLETED, TAB_PAUSED, TAB_RESUMED, TAB_COMPLETED, TAB_BILL_HIDDEN.\n\nEach event frame carries:\n- `event:` line — the event type (matches the JSON `event_type` discriminator).\n- `id:` line — a per-store monotonic event id used for `Last-Event-ID` reconnection.\n- `data:` line — a flat JSON object with `event_type`, `tab_id`, `merchant_reference`,\n  and event-specific fields.\n\nConnection behaviour:\n- The server emits a `:keepalive` SSE comment every ~20 seconds. ePOS clients should\n  reconnect if they don't receive one within 60 seconds.\n- The server closes the connection after ~10 minutes of no real events (heartbeats\n  don't count) so reconnects redistribute across replicas. ePOS should auto-reconnect.\n- On reconnect, send a `Last-Event-ID` header. POSLink replays missed events from a\n  short-lived 5-minute buffer.\n- Out-of-window reconnect: if the buffer is empty/expired, the server attaches the\n  stream silently with no replay. The ePOS MUST detect gaps by checking that the\n  first event id received is `LastEventId + 1`; if it jumps, call\n  `GET /poslink/v1/tabs/{tab_id}` to resync state for any affected tabs.\n"
      operationId: streamTabEvents
      parameters:
      - name: store_id
        in: query
        description: The store identifier
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: SSE stream established
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/TabEvent'
              examples:
                SHOW_BILL_REQUEST:
                  summary: Terminal asked the ePOS to push the bill
                  description: SHOW_BILL_REQUEST
                  value:
                    event_type: SHOW_BILL_REQUEST
                    tab_id: 3f2b6a2e-9d3e-4a1f-8f1e-6b2e5a8c9d01
                    merchant_reference: ORDER-2026-001
                    terminal_id: term-001
