                    merchant_reference: ORDER-2026-001
                    terminal_id: term-001
                    type: SPLIT
                    amount:
                      amount: 2500
                      currency: GBP
                    method: CARD
                TAB_PAYMENT_STATUS_PROGRESS:
                  summary: Granular status update during payment
                  description: TAB_PAYMENT_STATUS_PROGRESS
                  value:
                    event_type: TAB_PAYMENT_STATUS_PROGRESS
                    tab_id: 3f2b6a2e-9d3e-4a1f-8f1e-6b2e5a8c9d01
                    merchant_reference: ORDER-2026-001
                    payment_request_detail:
                      payment_request_id: 9c1a7c2c-3e2a-4d5b-9f8a-6c2e5a8c9d01
                      status: IN_PROGRESS
                      amount:
                        amount: 2500
                        currency: GBP
                      method: CARD
                      created_at: '2026-04-21T12:30:00Z'
                TAB_PAYMENT_COMPLETED:
                  summary: A single payment finished
                  description: TAB_PAYMENT_COMPLETED
                  value:
                    event_type: TAB_PAYMENT_COMPLETED
                    tab_id: 3f2b6a2e-9d3e-4a1f-8f1e-6b2e5a8c9d01
                    merchant_reference: ORDER-2026-001
                    payment_request_detail:
                      payment_request_id: 9c1a7c2c-3e2a-4d5b-9f8a-6c2e5a8c9d01
                      status: SUCCESSFUL
                      amount:
                        amount: 2500
                        currency: GBP
                      tip: 200
                      method: CARD
                      created_at: '2026-04-21T12:30:00Z'
                TAB_PAUSED:
