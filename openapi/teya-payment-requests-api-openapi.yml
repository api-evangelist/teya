components:
  schemas:
    CreatePaymentResponseV3:
      type: object
      description: Response to a request to create a new payment request. Includes tab_id and payment_type when the payment is linked to a tab.
      example:
        payment_request_id: dfc4fc52-8293-45b6-9f3e-b3b0f8f88188
        requested_amount:
          currency: GBP
          amount: 1500
          tip: 0
        status: NEW
        transaction_type: SALE
        created_at: '2026-04-21T10:05:00Z'
        updated_at: '2026-04-21T10:05:00Z'
        merchant_reference: ORDER_123
        terminal_id: 70dc65ba-1c13-492a-82a0-15821e5f63ba
        store_id: eac4d470-4731-45b2-af6b-c828f03c1f9d
        epos_instance_id: eposName_1
      properties:
        payment_request_id:
          type: string
          format: uuid
          description: The payment request identifier
          example: dfc4fc52-8293-45b6-9f3e-b3b0f8f88188
        created_at:
          type: string
          description: The date and time the payment request was created at (ISO 8601 format, in UTC)
          example: '2022-06-15T16:24:12Z'
        terminal_id:
          type: string
          description: The terminal identifier
          example: 2a3bdd2f-b52a-426c-b0fc-48c963650882
        merchant_reference:
          type: string
          description: The unique external identifier of each payment request sent by the ePOS
          example: MR1364624531
        requested_amount:
          $ref: '#/components/schemas/RequestedAmount'
          description: Requested amount
        status:
          type: string
          description: The current status of the request
          enum:
          - NEW
          example: NEW
        transaction_type:
          type: string
          description: The transaction type of this request
          example: SALE
        updated_at:
          type: string
          description: The date and time the payment request was last updated (ISO 8601 format, in UTC)
          example: '2022-06-15T16:26:12Z'
        epos_instance_id:
          type: string
          description: The external ID of the ePOS sending the request. Should be unique in order to identify that particular ePOS instance / device.
          example: eposName_1
        store_id:
          type: string
          format: uuid
          description: The store identifier
          example: da728238-ee94-470a-a1ba-a03161fdf98c
        tab_id:
          type: string
          format: uuid
          description: Tab identifier when the payment is linked to a tab; absent for standalone payments.
          example: 3f2b6a2e-9d3e-4a1f-8f1e-6b2e5a8c9d01
        payment_type:
          type: string
          description: Payment settlement type when the payment is linked to a tab; absent otherwise.
          enum:
          - FULL
          - SPLIT
          example: FULL
        payment_method:
          type: string
          description: How the payment is tendered. Absent if not supplied on the request.
          enum:
          - CARD
          - CASH
          example: CARD
      title: CreatePaymentResponseV3
    ExceptionResponse:
      type: object
      example:
        code: BAD_REQUEST
        description: Bad Request
      properties:
        code:
          type: string
          format: enum
          description: Error code
          example: BAD_REQUEST
        description:
          type: string
          description: Error description
          example: Bad Request
        invalid_params:
          type: array
          description: List of invalid request parameters. Populated for validation failures (400 / 422); omitted otherwise.
          items:
            $ref: '#/components/schemas/InvalidParams'
      title: ExceptionResponse
    RequestedAmount:
      type: object
      example:
        currency: GBP
        amount: 50
        tip: 0
      properties:
        currency:
          type: string
          format: ISO 4217
          description: The currency used in this payment. Must be a valid ISO 4217 currency code
          example: USD
        amount:
          type: integer
          format: int64
          description: A positive integer representing the full amount to charge in the smallest currency unit (e.g., 100 cents to charge $1). Inclusive of the tip
          example: 1500
        tip:
          type: integer
          format: int64
          description: A positive integer that represents the tip added to the payment in the smallest currency unit (e.g., 100 cents to charge $1)
          example: 10
      required:
      - amount
      - currency
      title: RequestedAmount
    CreatePaymentRequestV3:
      type: object
      description: Request to create a new payment request. Supports standalone payments (SALE or REFUND) and Pay at Table payments (SALE only, when tab_id is provided). See transaction_type for how to request a standalone unreferenced refund.
      example:
        store_id: eac4d470-4731-45b2-af6b-c828f03c1f9d
        terminal_id: 70dc65ba-1c13-492a-82a0-15821e5f63ba
        requested_amount:
          amount: 1500
          currency: GBP
          tip: 10
        transaction_type: SALE
        merchant_reference: ORDER_123
        epos_instance_id: eposName_1
        basket_transaction_id: 2f1b9c7c-8f0a-4e9c-9b04-8c9f4f0f0a2b
      properties:
        store_id:
          type: string
          format: uuid
          description: The ID of the store sending the request
          example: eac4d470-4731-45b2-af6b-c828f03c1f9d
        terminal_id:
          type: string
          description: The ID of the terminal the request is assigned to.
          example: 70dc65ba-1c13-492a-82a0-15821e5f63ba
          maxLength: 100
          minLength: 1
        requested_amount:
          $ref: '#/components/schemas/RequestedAmount'
          description: Requested Amount
        transaction_type:
          type: string
          format: enum
          description: 'The transaction type of this request.

            - `SALE`: a standard card-present payment (customer pays the merchant).

            - `REFUND`: a standalone, unreferenced card-present refund (money returned to the customer''s card with no original transaction to reference). The customer taps their card at the terminal; a new gateway transaction is created. `REFUND` is only valid for standalone requests — it is rejected with HTTP 422 when `tab_id` is present, because Pay at Table supports `SALE` only.'
          enum:
          - SALE
          - REFUND
          example: SALE
          maxLength: 8
          minLength: 1
        merchant_reference:
          type: string
          description: The merchant reference for this payment request. Must be a unique reference that can be used to uniquely identify this payment.
          example: ORDER_123
          maxLength: 100
          minLength: 1
        epos_instance_id:
          type: string
          description: The external ID of the ePOS sending the request. Identifies that particular ePOS instance / device.
          example: eposName_1
          maxLength: 100
          minLength: 0
        basket_transaction_id:
          type: string
          format: uuid
          description: Opaque correlation ID issued by Basket Data Service (BDS) at basket checkout.
          example: 2f1b9c7c-8f0a-4e9c-9b04-8c9f4f0f0a2b
        tab_id:
          type: string
          format: uuid
          description: Tab identifier for Pay at Table flows. When provided, links this payment to an existing tab and payment_type becomes required.
          example: 3f2b6a2e-9d3e-4a1f-8f1e-6b2e5a8c9d01
        payment_type:
          type: string
          description: Payment settlement type. Required when tab_id is present; ignored otherwise.
          enum:
          - FULL
          - SPLIT
          example: FULL
        payment_method:
          type: string
          description: How the payment is tendered. Optional; typically supplied for Pay at Table flows.
          enum:
          - CARD
          - CASH
          example: CARD
      required:
      - merchant_reference
      - requested_amount
      - store_id
      - terminal_id
      - transaction_type
      title: CreatePaymentRequestV3
    InvalidParams:
      type: object
      description: A single failed parameter from a 4xx validation response.
      example:
        path: requested_amount.amount
        reason: Amount exceeds the tab's remaining balance
      properties:
        path:
          type: string
          description: Dot-notation path to the offending field on the request body, in snake_case.
          example: requested_amount.amount
        reason:
          type: string
          description: Human-readable explanation of why the parameter was rejected.
          example: Amount exceeds the tab's remaining balance
      required:
      - path
      - reason
      title: InvalidParams
    Card:
      type: object
      example:
        last4: '4673'
        issuing_country: GB
        brand: MASTERCARD
        type: DEBIT
        bin: '123456'
      properties:
        last4:
