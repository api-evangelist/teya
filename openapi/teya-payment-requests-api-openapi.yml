          description: Transaction metadata
        transaction_timestamp:
          type: string
          format: date-time
          description: Transaction timestamp when the transaction occurred (in ISO 8601 with time-zone)
          example: '2025-10-24T21:56:24.464Z'
      title: RetrievePaymentResponse
    Paging:
      type: object
      example:
        offset: 0
        limit: 10
        total_pages: 1
      properties:
        offset:
          type: integer
          format: int32
          description: Current page number
          example: 2
        limit:
          type: integer
          format: int32
          description: Current page size
          example: 5
        total_pages:
          type: integer
          format: int32
          description: Total number of pages
          example: 3
        total_count:
          type: integer
          format: int64
          description: Total size
          example: 15
      title: Paging
    PaymentMethodDetails:
      type: object
      example:
        card:
          last4: '4673'
          issuing_country: GB
          brand: MASTERCARD
          type: DEBIT
          bin: '123456'
        entry_mode: EMV_CONTACTLESS
        verification_method: NONE
        application_id: A0000000041010
        response_code: '00'
        authorisation_code: '537001'
      properties:
        card:
          $ref: '#/components/schemas/Card'
          description: Card
        entry_mode:
          type: string
          description: The method by which the card was used
          example: ECOM, EMV_PIN, CONTACT_ICC, EMV_CONTACTLESS, KEYED, MAGSTRIPE_SWIPED, ON_FILE, MAGSTRIPE_FALLBACK
        verification_method:
          type: string
          description: The method by which the card was verified
          example: NONE, ELECTRONIC_SIGNATURE, ON_DEVICE, MANUAL, SIGNATURE, OFFLINE_PIN, ONLINE_PIN, OFFLINE_PIN_PLUS_SIGNATURE, SECURED_ELECTRONIC_COMMERCE
        application_name:
          type: string
          description: Application preferred name, a human-readable name of the EMV card application selected by the terminal during a chip card transaction
          example: Debit MasterCard
        application_id:
          type: string
          description: Application ID that uniquely identifies the card type
          example: A0000000041010
        mid:
          type: string
          description: Merchant acquiring MID
          example: MID5006544
        response_code:
          type: string
          description: Transaction response code provided by the schemes
          example: '00'
        authorisation_code:
          type: string
          description: Authorisation code used to approve a transaction
          example: A8RLR8
      title: PaymentMethodDetails
    CancelPaymentRequestResponse:
      type: object
      example:
        payment_request_id: dfc4fc52-8293-45b6-9f3e-b3b0f8f88188
        status: CANCELLING
        updated_at: '2023-08-14T11:28:45.610Z'
      properties:
        payment_request_id:
          type: string
          format: uuid
          description: The ID assigned to the payment request
          example: dfc4fc52-8293-45b6-9f3e-b3b0f8f88188
        status:
          type: string
          description: The current status of the request. Note that this cannot be NEW
          enum:
          - CANCELLING
          - CANCELLED
          example: CANCELLED
        updated_at:
          type: string
          description: The date and time the payment request was last updated (ISO 8601 format)
          example: '2023-03-02T16:24:16.449Z'
      title: CancelPaymentRequestResponse
    TransactionMetadata:
      type: object
      example:
        payment_method_details:
          card:
            last4: '4673'
            issuing_country: GB
            brand: MASTERCARD
            type: DEBIT
            bin: '123456'
          entry_mode: EMV_CONTACTLESS
          verification_method: NONE
          application_id: A0000000041010
          mid: '5006544'
          response_code: '00'
          authorisation_code: '537001'
      properties:
        payment_method_details:
          $ref: '#/components/schemas/PaymentMethodDetails'
          description: The payment method details
        dcc:
          $ref: '#/components/schemas/DccData'
          description: Dynamic Currency Conversion data. Optional field
      title: TransactionMetadata
    RetrieveStreamPaymentResponse:
      type: object
      example:
        payment_request_id: dfc4fc52-8293-45b6-9f3e-b3b0f8f88188
        status: IN_PROGRESS
        progress_status: WAITING_FOR_CARD_ENTRY
        updated_at: '2022-06-15T16:26:12Z'
      properties:
        payment_request_id:
          type: string
          format: uuid
          description: The payment request identifier
          example: dfc4fc52-8293-45b6-9f3e-b3b0f8f88188
        requested_amount:
          $ref: '#/components/schemas/RequestedAmount'
          description: Requested Amount
        status:
          type: string
          description: The current status of the request
          enum:
          - NEW
          - IN_PROGRESS
          - SUCCESSFUL
          - CANCELLING
          - CANCELLED
          - FAILED
          example: NEW
        transaction_type:
          type: string
          format: enum
          description: The transaction type of this request
          enum:
          - SALE
          - REFUND
          example: SALE
        created_at:
          type: string
          description: The date and time the payment request was created at (ISO 8601 format)
          example: '2023-03-02T16:24:16.449Z'
        updated_at:
          type: string
          description: The date and time the payment request was last updated (ISO 8601 format)
          example: '2023-03-02T16:24:16.449Z'
        merchant_reference:
          type: string
          description: The unique external identifier of each payment request sent by the ePOS
          example: ME1412342314234
        status_reason:
          type: string
          description: A description for the reason of a status
          enum:
          - CANCELLED_BY_EPOS
          - CANCELLED_BY_USER
          - DECLINED_ONLINE
          - DECLINED_OFFLINE
          - TIMEOUT
          - CONNECTION_ERROR
          - COMM_TIMEOUT
          - CARD_PROCESSING_ERROR
          - EXPIRED
          - UNKNOWN
          - TERMINAL_UNREACHABLE
          - NOTIFICATION_EXPIRED
          - SUPERSEDED_BY_NEW_TRANSACTION
          - TRANSACTION_ALREADY_IN_PROGRESS
          - FEATURE_NOT_ACTIVATED_UNREFERENCED_REFUNDS
          - UNSUPPORTED_CURRENCY
          example: CANCELLED_BY_USER
        epos_instance_id:
          type: string
          description: The external ID of the ePOS sending the request
          example: eposName_1
        gateway_payment_id:
          type: string
          description: Identifier of original payment. This field will be populated for a SUCCESSFUL payment request
          example: 39e3bacdd5d38d9ce611cf88afbcc86df829a9a5641880b3
        store_id:
          type: string
          format: uuid
          description: The store identifier
          example: f04fe1ce-e7bd-4c5b-b873-b156643c0bc3
        terminal_id:
          type: string
          description: The terminal identifier
          example: 70dc65ba-1c13-492a-82a0-15821e5f63ba
        progress_status:
          type: string
          format: enum
          description: Payment request progress status. Optional field to provide granular progress information during an update
          enum:
          - SENT_TO_PAYMENT_APP
          - RECEIVED
          - WAITING_FOR_CARD_ENTRY
          - TIP_SELECTION
          - CARD_PRESENTED
          - PIN_ENTRY
          - INSERT_CARD
          - DCC_SELECTION
          - REMOVE_CARD
          - APP_SELECTION
          - MOTO_FORM_SHOWN
          - UNKNOWN
          example: WAITING_FOR_CARD_ENTRY
        metadata:
          $ref: '#/components/schemas/TransactionMetadata'
          description: Transaction metadata
        transaction_timestamp:
          type: string
          format: date-time
          description: Transaction timestamp when the transaction occurred (in ISO 8601 with time-zone)
          example: '2025-10-24T21:56:24.464Z'
      title: RetrieveStreamPaymentResponse
    DccData:
      type: object
      description: Dynamic Currency Conversion data. If present, all fields are required.
      example:
        transaction_amount: 8500
        transaction_currency: GBP
        exchange_rate: '0.8650'
        conversion_fee: 2.5%
        disclaimer: I have been offered a choice of currencies and have chosen to accept DCC and pay in EUR at the exchange rate offered by Teya
      properties:
        transaction_amount:
          type: integer
          format: int64
          description: Transaction amount in the smallest currency unit (8500 = £85.00)
          example: 8500
        transaction_currency:
          type: string
          description: Currency used by the cardholder in ISO 4217 format (e.g. GBP)
          example: GBP
          maxLength: 3
          minLength: 3
          pattern: ^[A-Z]{3}$
        exchange_rate:
          type: string
          description: Exchange rate applied for DCC conversion (e.g. '0.8650' means 1 EUR (merchant currency) = 0.8650 GBP (cardholder currency))
          minLength: 1
        conversion_fee:
          type: string
          description: Conversion fee applied for DCC service, represented as a percentage string (e.g. '2.5%')
          example: 2.5%
          minLength: 1
        disclaimer:
          type: string
          description: Text printed on the customer's receipt confirming DCC acceptance and exchange rate details
          example: I have been offered a choice of currencies and have chosen to accept DCC and pay in GBP at the exchange rate offered by Teya
          maxLength: 500
          minLength: 1
      required:
      - conversion_fee
      - disclaimer
      - exchange_rate
      - transaction_amount
      - transaction_currency
      title: DccData
    NewCancelPaymentRequest:
      type: object
      example:
        status: CANCELLING
      properties:
        status:
          type: string
          description: The status to update the payment request to
          enum:
          - CANCELLING
      required:
      - status
      title: NewCancelPaymentRequest
