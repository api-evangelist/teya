overlay: 1.0.0
info:
  title: API Evangelist enhancements for Teya Online Payments
  version: 1.0.0
extends: openapi/teya-online-payments-openapi.yaml
actions:
  - target: $.info
    update:
      x-apievangelist-provider: teya
      x-apievangelist-product: online-payments
      x-apievangelist-idempotency: Idempotency-Key
      x-apievangelist-auth: oauth2 (authorizationCode + clientCredentials) via id.teya.com
      x-apievangelist-base-url: https://api.teya.com
  - target: $.servers
    update:
      - url: https://api.teya.com
        description: Production
      - url: https://api.teya.xyz
        description: Development / sandbox
