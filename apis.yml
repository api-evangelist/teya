aid: teya
name: Teya
description: >-
  Teya (formerly SaltPay) is a European payments and business-services provider serving local
  businesses with card machines, online and in-person card acquiring, a business account, and
  flexible business funding. Its developer platform exposes REST APIs for the full card-payment
  lifecycle: Online Payments (Hosted Checkout, PayByLink, e-commerce transactions, captures,
  refunds, digital receipts, tokens), a Payments Gateway (card-present, MOTO, refunds, captures,
  reversals), POSLink for cloud terminal control (payment requests, tabs, stores, terminals,
  ePOS registration, receipt printing), and a Teya FX API for Dynamic Currency Conversion, plus
  a SOAP-based Settlement API for payout reporting. Authentication is OAuth 2.0 (authorization
  code and client credentials) against id.teya.com, write operations support Idempotency-Key,
  and first-party SDKs cover web (Teya Blocks) and Android/iOS point-of-sale.
